<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Selene — Scale MBS AI Assistant</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌙</text></svg>">
<style>
  :root {
    --bg: #14100c;
    --panel: rgba(255, 255, 255, 0.05);
    --panel-border: rgba(255, 255, 255, 0.10);
    --text: #f3ede4;
    --text-dim: #b9ad9c;
    --accent: #d7a45f;
    --accent-deep: #a97a3a;
    --user-bubble: #2b241c;
    --selene-bubble: rgba(215, 164, 95, 0.12);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    background: radial-gradient(1200px 800px at 70% -10%, #2a2018 0%, var(--bg) 55%), var(--bg);
    color: var(--text);
    height: 100vh;
    overflow: hidden;
  }

  /* ---------- splash ---------- */
  #splash {
    position: fixed; inset: 0; z-index: 50;
    display: flex; align-items: center; justify-content: center; gap: 48px;
    background: radial-gradient(1000px 700px at 50% 20%, #241b12 0%, #0d0a07 70%);
    transition: opacity .6s ease;
    flex-wrap: wrap; padding: 24px;
  }
  #splash.hidden { opacity: 0; pointer-events: none; }
  #splash video {
    height: min(70vh, 560px); border-radius: 18px;
    box-shadow: 0 30px 80px rgba(0,0,0,.6);
    border: 1px solid var(--panel-border);
  }
  .splash-copy { max-width: 420px; }
  .splash-copy .kicker {
    color: var(--accent); letter-spacing: .25em; text-transform: uppercase;
    font-size: 12px; margin-bottom: 14px;
  }
  .splash-copy h1 { font-size: 52px; font-weight: 650; letter-spacing: -0.02em; margin-bottom: 14px; }
  .splash-copy p { color: var(--text-dim); font-size: 17px; line-height: 1.6; margin-bottom: 28px; }
  #startBtn {
    background: linear-gradient(135deg, var(--accent), var(--accent-deep));
    color: #1a130b; border: none; border-radius: 999px;
    padding: 15px 34px; font-size: 16px; font-weight: 700; cursor: pointer;
    box-shadow: 0 10px 30px rgba(215,164,95,.35);
    transition: transform .15s ease;
  }
  #startBtn:hover { transform: translateY(-2px); }
  .splash-note { margin-top: 16px; font-size: 12.5px; color: #7d7365; }

  /* ---------- app layout ---------- */
  #app {
    display: grid; grid-template-columns: minmax(320px, 460px) 1fr;
    gap: 20px; height: 100vh; padding: 20px; max-width: 1400px; margin: 0 auto;
  }
  @media (max-width: 860px) {
    body { overflow: auto; }
    #app { grid-template-columns: 1fr; height: auto; }
  }

  .card {
    background: var(--panel); border: 1px solid var(--panel-border);
    border-radius: 18px; backdrop-filter: blur(10px);
  }

  /* ---------- avatar panel ---------- */
  #avatarPanel { display: flex; flex-direction: column; overflow: hidden; }
  .avatar-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 18px; border-bottom: 1px solid var(--panel-border);
  }
  .avatar-head .name { font-weight: 700; font-size: 17px; letter-spacing: .02em; }
  .avatar-head .name span { color: var(--accent); }
  #statusPill {
    font-size: 11.5px; color: var(--text-dim);
    border: 1px solid var(--panel-border); border-radius: 999px; padding: 4px 10px;
    white-space: nowrap;
  }
  .video-wrap { position: relative; flex: 1; min-height: 300px; background: #0c0906; }
  #seleneVideo {
    width: 100%; height: 100%; object-fit: cover; display: block;
    filter: saturate(1.02);
  }
  #speakingRing {
    position: absolute; top: 12px; right: 12px; width: 12px; height: 12px;
    border-radius: 50%; background: #4a4136; transition: background .2s, box-shadow .2s;
  }
  #speakingRing.on { background: #6fdc8c; box-shadow: 0 0 12px #6fdc8c; }
  #caption {
    position: absolute; left: 0; right: 0; bottom: 22px;
    text-align: center; padding: 0 20px; pointer-events: none;
    opacity: 0; transition: opacity .25s ease;
  }
  #caption.show { opacity: 1; }
  #caption span {
    display: inline-block; background: rgba(0,0,0,.55); color: #fff;
    font-size: 20px; font-weight: 700; line-height: 1.45;
    padding: 4px 14px; border-radius: 10px;
    text-shadow: 0 2px 6px rgba(0,0,0,.8);
    backdrop-filter: blur(2px);
  }
  .avatar-controls {
    display: flex; gap: 10px; align-items: center;
    padding: 12px 16px; border-top: 1px solid var(--panel-border);
  }
  .avatar-controls select {
    flex: 1; min-width: 0; background: #1e1811; color: var(--text);
    border: 1px solid var(--panel-border); border-radius: 8px; padding: 7px 8px; font-size: 12.5px;
  }
  .icon-btn {
    background: #1e1811; color: var(--text); border: 1px solid var(--panel-border);
    border-radius: 8px; padding: 7px 12px; cursor: pointer; font-size: 13px; white-space: nowrap;
  }
  .icon-btn:hover { border-color: var(--accent); }
  .icon-btn.off { color: #8b7f6e; }

  /* ---------- chat panel ---------- */
  #chatPanel { display: flex; flex-direction: column; overflow: hidden; }
  #messages { flex: 1; overflow-y: auto; padding: 22px; display: flex; flex-direction: column; gap: 14px; }
  .msg { max-width: 78%; padding: 12px 16px; border-radius: 16px; font-size: 15px; line-height: 1.55; white-space: pre-wrap; }
  .msg.user { align-self: flex-end; background: var(--user-bubble); border: 1px solid #3a3126; border-bottom-right-radius: 5px; }
  .msg.selene { align-self: flex-start; background: var(--selene-bubble); border: 1px solid rgba(215,164,95,.25); border-bottom-left-radius: 5px; }
  .msg.selene .who { font-size: 11px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--accent); margin-bottom: 5px; }
  .msg.error { align-self: center; background: rgba(230,57,70,.12); border: 1px solid rgba(230,57,70,.4); color: #f2b8bd; font-size: 13.5px; max-width: 92%; }
  .typing { display: inline-flex; gap: 5px; padding: 4px 2px; }
  .typing i { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); opacity: .4; animation: blink 1.2s infinite; }
  .typing i:nth-child(2) { animation-delay: .2s; } .typing i:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 0%,80%,100% { opacity: .25 } 40% { opacity: 1 } }

  #suggestions { display: flex; gap: 8px; flex-wrap: wrap; padding: 0 22px 10px; }
  .chip {
    background: transparent; color: var(--text-dim); border: 1px solid var(--panel-border);
    border-radius: 999px; padding: 7px 14px; font-size: 12.5px; cursor: pointer; transition: all .15s;
  }
  .chip:hover { color: var(--accent); border-color: var(--accent); }

  #composer { display: flex; gap: 10px; padding: 14px 18px; border-top: 1px solid var(--panel-border); }
  #input {
    flex: 1; background: #1e1811; border: 1px solid var(--panel-border); border-radius: 12px;
    color: var(--text); padding: 13px 16px; font-size: 15px; outline: none; resize: none; max-height: 120px;
    font-family: inherit;
  }
  #input:focus { border-color: var(--accent); }
  #sendBtn {
    background: linear-gradient(135deg, var(--accent), var(--accent-deep));
    color: #1a130b; border: none; border-radius: 12px; padding: 0 24px;
    font-size: 15px; font-weight: 700; cursor: pointer;
  }
  #sendBtn:disabled { opacity: .45; cursor: default; }
</style>
</head>
<body>

<div id="splash">
  <video src="selene-full.mp4" poster="selene-full-poster.jpg" autoplay muted loop playsinline></video>
  <div class="splash-copy">
    <div class="kicker">Scale Modern Business Solutions</div>
    <h1>Meet Selene.</h1>
    <p>Scale's AI assistant and the brain behind many of our programs. Ask her anything about the company — she talks, you listen.</p>
    <button id="startBtn">Talk to Selene</button>
    <div class="splash-note">Runs locally. Voice &amp; subtitles are generated on your machine.</div>
  </div>
</div>

<div id="app">
  <div id="avatarPanel" class="card">
    <div class="avatar-head">
      <div class="name">SELENE <span>· Scale MBS</span></div>
      <div id="statusPill">connecting…</div>
    </div>
    <div class="video-wrap">
      <video id="seleneVideo" src="selene-talk.mp4" poster="selene-poster.jpg" muted loop playsinline preload="auto"></video>
      <div id="speakingRing"></div>
      <div id="caption"><span id="captionText"></span></div>
    </div>
    <div class="avatar-controls">
      <select id="voiceSelect" title="Selene's voice"></select>
      <button id="muteBtn" class="icon-btn" title="Toggle voice">🔊 Voice on</button>
    </div>
  </div>

  <div id="chatPanel" class="card">
    <div id="messages"></div>
    <div id="suggestions">
      <button class="chip">What does Scale MBS do?</button>
      <button class="chip">Walk me through our 29-day outreach cadence</button>
      <button class="chip">Who is on the team?</button>
      <button class="chip">What tools do we run the business on?</button>
    </div>
    <div id="composer">
      <textarea id="input" rows="1" placeholder="Ask Selene about Scale MBS…"></textarea>
      <button id="sendBtn">Send</button>
    </div>
  </div>
</div>

<script>
const $ = (id) => document.getElementById(id);
const messagesEl = $('messages'), inputEl = $('input'), sendBtn = $('sendBtn');
const video = $('seleneVideo'), captionEl = $('caption'), captionText = $('captionText');
const ring = $('speakingRing');
const history = [];
let muted = false;
let busy = false;

/* ================= voice & subtitles ================= */
const synth = window.speechSynthesis;
let voices = [];
let queueDepth = 0; // utterances pending or speaking

function pickDefaultVoice() {
  const saved = localStorage.getItem('selene_voice');
  if (saved && voices.some(v => v.name === saved)) return saved;
  const prefs = ['Samantha', 'Google US English', 'Microsoft Aria', 'Microsoft Jenny',
                 'Google UK English Female', 'Zira', 'Victoria', 'Karen', 'Moira', 'Female'];
  for (const p of prefs) {
    const v = voices.find(v => v.lang.startsWith('en') && v.name.includes(p));
    if (v) return v.name;
  }
  const en = voices.find(v => v.lang.startsWith('en'));
  return en ? en.name : (voices[0] && voices[0].name);
}

function loadVoices() {
  voices = synth.getVoices();
  if (!voices.length) return;
  const sel = $('voiceSelect');
  const current = pickDefaultVoice();
  sel.innerHTML = '';
  voices.filter(v => v.lang.startsWith('en')).forEach(v => {
    const o = document.createElement('option');
    o.value = v.name; o.textContent = `${v.name} (${v.lang})`;
    if (v.name === current) o.selected = true;
    sel.appendChild(o);
  });
}
synth.onvoiceschanged = loadVoices;
loadVoices();
$('voiceSelect').addEventListener('change', e => localStorage.setItem('selene_voice', e.target.value));

$('muteBtn').addEventListener('click', () => {
  muted = !muted;
  $('muteBtn').textContent = muted ? '🔇 Voice off' : '🔊 Voice on';
  $('muteBtn').classList.toggle('off', muted);
  if (muted) { synth.cancel(); queueDepth = 0; stopTalking(); }
});

function startTalking() {
  ring.classList.add('on');
  captionEl.classList.add('show');
  video.play().catch(() => {});
}
function stopTalking() {
  ring.classList.remove('on');
  captionEl.classList.remove('show');
  video.pause();
}

// Break an utterance into caption lines of a few words, like the original videos.
function captionLines(text, wordsPerLine = 5) {
  const words = text.split(/\s+/).filter(Boolean);
  const lines = [];
  for (let i = 0; i < words.length; i += wordsPerLine) {
    lines.push({ start: i, text: words.slice(i, i + wordsPerLine).join(' ') });
  }
  return { words, lines };
}

function speak(text) {
  const clean = text.replace(/[*_#`~>|]/g, '').replace(/\s+/g, ' ').trim();
  if (!clean) return;
  const { words, lines } = captionLines(clean);
  if (muted) return; // captions ride on speech; when muted the chat bubble is the record
  const u = new SpeechSynthesisUtterance(clean);
  const chosen = voices.find(v => v.name === $('voiceSelect').value);
  if (chosen) u.voice = chosen;
  u.rate = 1.02; u.pitch = 1.0;
  queueDepth++;
  u.onstart = () => { startTalking(); captionText.textContent = lines[0] ? lines[0].text : clean; };
  u.onboundary = (e) => {
    if (e.name && e.name !== 'word') return;
    // map charIndex -> word index -> caption line
    const before = clean.slice(0, e.charIndex).split(/\s+/).filter(Boolean).length;
    const line = lines.filter(l => l.start <= before).pop();
    if (line) captionText.textContent = line.text;
  };
  const finish = () => { queueDepth = Math.max(0, queueDepth - 1); if (queueDepth === 0) stopTalking(); };
  u.onend = finish; u.onerror = finish;
  synth.speak(u);
}

// Sentence splitter for incremental speech during streaming.
function makeSentenceFeeder() {
  let buf = '';
  return {
    push(t) {
      buf += t;
      let out = [];
      let m;
      while ((m = buf.match(/^[\s\S]*?[.!?…](?=\s|$)|^[\s\S]*?\n/))) {
        out.push(m[0]); buf = buf.slice(m[0].length);
      }
      out.forEach(s => speak(s));
    },
    flush() { if (buf.trim()) speak(buf); buf = ''; },
  };
}

/* ================= chat ================= */
function addMsg(role, text) {
  const div = document.createElement('div');
  div.className = 'msg ' + role;
  if (role === 'selene') {
    div.innerHTML = '<div class="who">Selene</div><div class="body"></div>';
    div.querySelector('.body').textContent = text;
  } else {
    div.textContent = text;
  }
  messagesEl.appendChild(div);
  messagesEl.scrollTop = messagesEl.scrollHeight;
  return div;
}

function addTyping() {
  const div = document.createElement('div');
  div.className = 'msg selene';
  div.innerHTML = '<div class="who">Selene</div><div class="typing"><i></i><i></i><i></i></div>';
  messagesEl.appendChild(div);
  messagesEl.scrollTop = messagesEl.scrollHeight;
  return div;
}

async function send(text) {
  text = (text || inputEl.value).trim();
  if (!text || busy) return;
  busy = true; sendBtn.disabled = true; inputEl.value = '';
  synth.cancel(); queueDepth = 0; stopTalking();

  addMsg('user', text);
  history.push({ role: 'user', content: text });
  const bubble = addTyping();
  const feeder = makeSentenceFeeder();
  let full = '';

  try {
    const res = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ messages: history }),
    });
    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buf = '';
    for (;;) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += decoder.decode(value, { stream: true });
      let idx;
      while ((idx = buf.indexOf('\n\n')) >= 0) {
        const frame = buf.slice(0, idx); buf = buf.slice(idx + 2);
        const line = frame.split('\n').find(l => l.startsWith('data: '));
        if (!line) continue;
        const ev = JSON.parse(line.slice(6));
        if (ev.type === 'text') {
          if (!full) bubble.innerHTML = '<div class="who">Selene</div><div class="body"></div>';
          full += ev.text;
          bubble.querySelector('.body').textContent = full;
          messagesEl.scrollTop = messagesEl.scrollHeight;
          feeder.push(ev.text);
        } else if (ev.type === 'error') {
          throw new Error(ev.message);
        }
      }
    }
    feeder.flush();
    if (full) {
      history.push({ role: 'assistant', content: full });
    } else {
      bubble.remove();
    }
  } catch (err) {
    bubble.remove();
    history.pop(); // let the user retry the same question
    addMsg('error', '⚠ ' + err.message);
  }
  busy = false; sendBtn.disabled = false; inputEl.focus();
}

sendBtn.addEventListener('click', () => send());
inputEl.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
});
document.querySelectorAll('.chip').forEach(c => c.addEventListener('click', () => send(c.textContent)));

/* ================= boot ================= */
const GREETING = "Hi, my name is Selene. I am Scale's AI assistant and the brain behind many of our programs. My sole purpose is to serve you and make your life better. Where should we begin?";

async function health() {
  try {
    const h = await (await fetch('/api/health')).json();
    const brain = h.provider === 'anthropic' ? `Claude · ${h.model}` : `Local · ${h.model}`;
    $('statusPill').textContent = `${brain} · ${h.knowledgeDocs.length} docs`;
  } catch {
    $('statusPill').textContent = 'server offline';
  }
}
health();

$('startBtn').addEventListener('click', () => {
  $('splash').classList.add('hidden');
  setTimeout(() => $('splash').remove(), 700);
  loadVoices(); // some browsers populate voices only after a gesture
  addMsg('selene', GREETING);
  history.push({ role: 'assistant', content: GREETING });
  setTimeout(() => speak(GREETING), 300);
  inputEl.focus();
});
</script>
</body>
</html>
