<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Draft Reply</title>
  <style>
    :root {
      --ink: #0b2239;
      --muted: #51657a;
      --accent: #1d7dd8;
      --glass: rgba(255, 255, 255, 0.58);
      --glass-border: rgba(255, 255, 255, 0.68);
      --glass-highlight: rgba(255, 255, 255, 0.9);
      --glass-gradient: linear-gradient(135deg, rgba(255, 255, 255, 0.72), rgba(255, 255, 255, 0.22));
      --shadow: 0 14px 35px rgba(7, 22, 39, 0.18);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 24px;
      font-family: "Segoe UI", Arial, sans-serif;
      color: var(--ink);
      background: url('background.png') no-repeat center center fixed;
      background-size: cover;
      min-height: 100vh;
      position: relative;
      isolation: isolate;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(circle at top left, rgba(255, 255, 255, 0.45), transparent 45%),
        radial-gradient(circle at 70% 20%, rgba(255, 255, 255, 0.25), transparent 50%),
        radial-gradient(circle at bottom right, rgba(255, 255, 255, 0.3), transparent 55%);
      opacity: 0.85;
      pointer-events: none;
      z-index: -1;
    }

    .app {
      max-width: 1100px;
      margin: 0 auto;
      display: grid;
      gap: 16px;
    }

    .card {
      border-radius: 16px;
      padding: 16px 18px;
    }

    .card {
      position: relative;
      overflow: hidden;
      background: var(--glass-gradient);
      border: 1px solid var(--glass-border);
      box-shadow: var(--shadow), inset 0 1px 0 rgba(255, 255, 255, 0.6);
      backdrop-filter: blur(22px) saturate(170%);
      -webkit-backdrop-filter: blur(22px) saturate(170%);
    }

    .card::before {
      content: '';
      position: absolute;
      inset: -60% -30%;
      background: radial-gradient(circle at 20% 20%, var(--glass-highlight), transparent 55%);
      opacity: 0.7;
      pointer-events: none;
    }

    .card > * {
      position: relative;
      z-index: 1;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
    }

    .header h1 {
      margin: 0;
    }

    .back-link {
      text-decoration: none;
      color: var(--accent);
      font-weight: 600;
    }

    .meta {
      color: var(--muted);
      font-size: 0.9rem;
    }

    pre {
      margin: 0;
      white-space: pre-wrap;
      font-family: "Segoe UI", Arial, sans-serif;
    }

    textarea {
      width: 100%;
      min-height: 220px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.75);
      padding: 12px;
      font-family: "Segoe UI", Arial, sans-serif;
      font-size: 0.95rem;
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.7), rgba(255, 255, 255, 0.25));
      box-shadow: 0 10px 24px rgba(15, 23, 42, 0.12);
      backdrop-filter: blur(16px) saturate(160%);
      -webkit-backdrop-filter: blur(16px) saturate(160%);
    }

    .actions {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-top: 12px;
      flex-wrap: wrap;
    }

    .primary {
      background: linear-gradient(135deg, #1d7dd8 0%, #5bb5ff 100%);
      color: white;
      border: none;
      border-radius: 10px;
      padding: 10px 16px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 10px 24px rgba(29, 125, 216, 0.35);
    }

    .status {
      color: var(--muted);
      font-size: 0.85rem;
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="header">
      <h1>Draft Reply</h1>
      <a href="index.html" class="back-link">Back to Inbox</a>
    </div>

    <section class="card">
      <h2>Original message</h2>
      <div id="original"></div>
    </section>

    <section class="card">
      <h2>AI summary</h2>
      <div id="summary" class="meta"></div>
    </section>

    <section class="card">
      <h2>Draft reply</h2>
      <textarea id="draft" spellcheck="false"></textarea>
      <div class="actions">
        <button id="copyDraft" class="primary">Copy draft</button>
        <span id="copyStatus" class="status"></span>
      </div>
    </section>
  </div>

  <script>
    const STORAGE_KEY = 'ai_email_sorter_emails_v1';
    const ACTIVE_EMAIL_KEY = 'ai_email_sorter_active_email';

    function getQueryParam(name) {
      const params = new URLSearchParams(window.location.search);
      return params.get(name);
    }

    function loadEmails() {
      const stored = localStorage.getItem(STORAGE_KEY);
      if (!stored) return [];
      try {
        const parsed = JSON.parse(stored);
        return Array.isArray(parsed) ? parsed : [];
      } catch (err) {
        return [];
      }
    }

    function splitSentences(text) {
      return text.match(/[^.!?]+[.!?]?/g) || [];
    }

    function summarise(text) {
      const sentences = splitSentences(text || '');
      const selected = [];
      for (const sentence of sentences) {
        if (sentence.trim().split(/\s+/).length > 5) {
          selected.push(sentence.trim());
        }
        if (selected.length >= 3) break;
      }
      if (selected.length === 0) {
        return text.length > 120 ? text.slice(0, 117) + '...' : text;
      }
      return selected.join(' ');
    }

    function buildDraft(email) {
      const greetingName = email.sender ? email.sender.split('@')[0] : 'there';
      const summary = summarise(email.body || '');
      return 'Hi ' + greetingName + ',\n\n' +
        'Thanks for reaching out. Here is a quick summary of your message:\n' +
        summary + '\n\n' +
        'I will follow up with the next steps shortly.\n\n' +
        'Best regards,\nYour Name';
    }

    function renderOriginal(email) {
      const original = document.getElementById('original');
      original.innerHTML = '';

      const from = document.createElement('div');
      from.className = 'meta';
      from.textContent = 'From: ' + (email.sender || 'Unknown sender');

      const subject = document.createElement('div');
      subject.className = 'meta';
      subject.textContent = 'Subject: ' + (email.subject || '(no subject)');

      const body = document.createElement('pre');
      body.textContent = email.body || '';

      original.appendChild(from);
      original.appendChild(subject);
      original.appendChild(body);
    }

    function init() {
      const emails = loadEmails();
      const id = getQueryParam('id') || localStorage.getItem(ACTIVE_EMAIL_KEY);
      const email = emails.find(item => item.id === id) || emails[0];

      if (!email) {
        document.getElementById('original').textContent = 'No email selected.';
        document.getElementById('summary').textContent = '';
        document.getElementById('draft').value = '';
        return;
      }

      renderOriginal(email);
      const summary = summarise(email.body || '');
      document.getElementById('summary').textContent = summary || 'No summary available.';

      const draft = buildDraft(email);
      document.getElementById('draft').value = draft;

      document.getElementById('copyDraft').addEventListener('click', async () => {
        const status = document.getElementById('copyStatus');
        try {
          await navigator.clipboard.writeText(draft);
          status.textContent = 'Draft copied to clipboard.';
        } catch (err) {
          status.textContent = 'Copy failed - use manual selection.';
        }
      });
    }

    init();
  </script>
</body>
</html>
