<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trial Activated</title>
  <style>
    :root {
      --ink: #0b2239;
      --muted: #51657a;
      --accent: #1d7dd8;
      --glass: rgba(255, 255, 255, 0.58);
      --glass-border: rgba(255, 255, 255, 0.68);
      --glass-highlight: rgba(255, 255, 255, 0.9);
      --glass-gradient: linear-gradient(135deg, rgba(255, 255, 255, 0.72), rgba(255, 255, 255, 0.22));
      --shadow: 0 14px 35px rgba(7, 22, 39, 0.18);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 24px;
      font-family: "Segoe UI", Arial, sans-serif;
      color: var(--ink);
      background: url('background.png') no-repeat center center fixed;
      background-size: cover;
      min-height: 100vh;
      position: relative;
      isolation: isolate;
      display: grid;
      place-items: center;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(circle at top left, rgba(255, 255, 255, 0.45), transparent 45%),
        radial-gradient(circle at 70% 20%, rgba(255, 255, 255, 0.25), transparent 50%),
        radial-gradient(circle at bottom right, rgba(255, 255, 255, 0.3), transparent 55%);
      opacity: 0.85;
      pointer-events: none;
      z-index: -1;
    }

    .card {
      position: relative;
      overflow: hidden;
      padding: 24px;
      border-radius: 18px;
      background: var(--glass-gradient);
      border: 1px solid var(--glass-border);
      box-shadow: var(--shadow), inset 0 1px 0 rgba(255, 255, 255, 0.6);
      backdrop-filter: blur(22px) saturate(170%);
      -webkit-backdrop-filter: blur(22px) saturate(170%);
      max-width: 520px;
      display: grid;
      gap: 12px;
      text-align: center;
    }

    .card::before {
      content: '';
      position: absolute;
      inset: -60% -30%;
      background: radial-gradient(circle at 20% 20%, var(--glass-highlight), transparent 55%);
      opacity: 0.7;
      pointer-events: none;
    }

    .card > * {
      position: relative;
      z-index: 1;
    }

    h1 {
      margin: 0;
      font-size: 1.8rem;
    }

    p {
      margin: 0;
      color: var(--muted);
    }

    a {
      display: inline-block;
      margin-top: 8px;
      padding: 10px 16px;
      border-radius: 10px;
      background: linear-gradient(135deg, #1d7dd8 0%, #5bb5ff 100%);
      color: white;
      text-decoration: none;
      font-weight: 600;
      box-shadow: 0 10px 24px rgba(29, 125, 216, 0.35);
    }
  </style>
</head>
<body>
  <div class="card">
    <h1 id="title">Validating trial...</h1>
    <p id="statusLine">Checking your Stripe checkout session.</p>
    <p id="detailLine">This usually takes a moment.</p>
    <a href="index.html">Open inbox</a>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const sessionId = params.get('session_id');
    const title = document.getElementById('title');
    const statusLine = document.getElementById('statusLine');
    const detailLine = document.getElementById('detailLine');

    async function confirmTrial() {
      if (!sessionId) {
        title.textContent = 'Missing checkout session';
        statusLine.textContent = 'No session_id was provided.';
        detailLine.textContent = 'Please contact support to activate your trial.';
        return;
      }

      try {
        const resp = await fetch('/confirm-checkout-session?session_id=' + encodeURIComponent(sessionId));
        if (!resp.ok) {
          const error = await resp.json().catch(() => ({}));
          throw new Error(error.error || 'Unable to confirm checkout.');
        }
        const data = await resp.json();
        if (data.status === 'active') {
          localStorage.setItem('ai_email_sorter_trial_status', 'active');
          if (data.trial_end) {
            const trialStart = data.trial_end - 7 * 86400000;
            localStorage.setItem('ai_email_sorter_trial_start', String(trialStart));
          } else if (!localStorage.getItem('ai_email_sorter_trial_start')) {
            localStorage.setItem('ai_email_sorter_trial_start', String(Date.now()));
          }
          title.textContent = 'Trial activated';
          statusLine.textContent = 'Your 7-day free trial is now active.';
          detailLine.textContent = 'You can return to the app and start using premium features.';
          return;
        }
        throw new Error('Trial not active yet.');
      } catch (err) {
        title.textContent = 'Unable to confirm trial';
        statusLine.textContent = err.message;
        detailLine.textContent = 'Please contact support if this keeps happening.';
      }
    }

    confirmTrial();
  </script>
</body>
</html>
